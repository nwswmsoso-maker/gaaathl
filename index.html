<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3TX | تصميم مواقع</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', 'Segoe UI', sans-serif;
      background: #020003;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .screen {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, #0f0020 0%, #020003 70%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ========= جزيئات الخلفية ========= */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .particle {
      position: absolute;
      background: #7c3aed;
      border-radius: 50%;
      filter: blur(6px);
      animation: floatParticle 14s infinite ease-in-out;
    }

    @keyframes floatParticle {
      0% { transform: translate(0, 0) scale(0.5); opacity: 0.2; }
      25% { transform: translate(80px, -100px) scale(1.3); opacity: 0.6; }
      50% { transform: translate(-50px, -200px) scale(0.7); opacity: 0.3; }
      75% { transform: translate(100px, -80px) scale(1.5); opacity: 0.7; }
      100% { transform: translate(0, 0) scale(0.5); opacity: 0.2; }
    }

    /* ========= حلقات دائرية ========= */
    .ring {
      position: absolute;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 50%;
      animation: spinRing 30s linear infinite;
    }

    .ring-large {
      width: 700px;
      height: 700px;
      top: -150px;
      right: -200px;
    }
    .ring-medium {
      width: 500px;
      height: 500px;
      bottom: -120px;
      left: -150px;
      animation-direction: reverse;
      animation-duration: 22s;
    }
    .ring-small {
      width: 300px;
      height: 300px;
      top: 35%;
      left: 8%;
      border-color: rgba(192, 132, 252, 0.35);
      animation-duration: 18s;
    }

    @keyframes spinRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ========= المحتوى ========= */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    /* الشعار */
    .logo {
      font-size: 9rem;
      font-weight: 900;
      background: linear-gradient(180deg, #e9d5ff, #a855f7, #4c1d95);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 70px #a855f7);
      animation: logoGlow 2.5s infinite alternate;
      letter-spacing: 12px;
      line-height: 1;
    }

    @keyframes logoGlow {
      from { filter: drop-shadow(0 0 50px #a855f7); }
      to { filter: drop-shadow(0 0 100px #c084fc) drop-shadow(0 0 50px #7c3aed); }
    }

    .tagline {
      color: #c4b5fd;
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-shadow: 0 0 30px #7c3aed;
      margin-top: -18px;
    }

    /* بطاقات الخدمات */
    .services {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
    }

    .card {
      background: rgba(12, 3, 25, 0.7);
      backdrop-filter: blur(20px);
      border: 1.5px solid #7c3aed;
      border-radius: 30px;
      padding: 25px 32px;
      min-width: 155px;
      text-align: center;
      box-shadow: 0 0 35px rgba(124, 58, 237, 0.4);
      animation: cardFloat 3.5s infinite ease-in-out;
      transition: 0.3s;
    }

    .card:nth-child(1) { animation-delay: 0s; }
    .card:nth-child(2) { animation-delay: 0.5s; }
    .card:nth-child(3) { animation-delay: 1s; }

    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    .card i {
      font-size: 3.2rem;
      color: #c084fc;
      margin-bottom: 10px;
      display: block;
      filter: drop-shadow(0 0 18px #a855f7);
      animation: iconBounce 2s infinite;
    }

    @keyframes iconBounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .card h3 {
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .card p {
      color: #a78bfa;
      font-size: 0.8rem;
      margin-top: 4px;
    }

    /* مميزات */
    .features {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 5px;
    }

    .feature {
      background: rgba(18, 5, 30, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid #6b21a8;
      border-radius: 50px;
      padding: 10px 22px;
      color: #d8b4fe;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: featurePop 2.8s infinite ease-in-out;
    }

    .feature:nth-child(2) { animation-delay: 0.3s; }
    .feature:nth-child(3) { animation-delay: 0.6s; }
    .feature:nth-child(4) { animation-delay: 0.9s; }

    @keyframes featurePop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .feature i {
      color: #a855f7;
    }

    /* نص سفلي */
    .footer-text {
      position: absolute;
      bottom: 30px;
      color: rgba(168, 133, 247, 0.5);
      font-size: 0.8rem;
      letter-spacing: 3px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="screen">

    <!-- جزيئات -->
    <div class="particles" id="particlesContainer"></div>

    <!-- حلقات -->
    <div class="ring ring-large"></div>
    <div class="ring ring-medium"></div>
    <div class="ring ring-small"></div>

    <!-- المحتوى -->
    <div class="content">
      <div class="logo">3TX</div>
      <div class="tagline">تصميم مواقع · متاجر · شخصية</div>

      <!-- خدمات -->
      <div class="services">
        <div class="card">
          <i class="fas fa-shopping-cart"></i>
          <h3>متاجر إلكترونية</h3>
          <p>احترافية كاملة</p>
        </div>
        <div class="card">
          <i class="fas fa-user-circle"></i>
          <h3>مواقع شخصية</h3>
          <p>سيرة ذاتية · أعمال</p>
        </div>
        <div class="card">
          <i class="fas fa-building"></i>
          <h3>مواقع شركات</h3>
          <p>هوية رقمية قوية</p>
        </div>
      </div>

      <!-- مميزات -->
      <div class="features">
        <div class="feature"><i class="fas fa-bolt"></i> سريع</div>
        <div class="feature"><i class="fas fa-mobile-alt"></i> متجاوب</div>
        <div class="feature"><i class="fas fa-shield-alt"></i> آمن</div>
        <div class="feature"><i class="fas fa-paint-brush"></i> إبداعي</div>
      </div>
    </div>

    <span class="footer-text">3TX DESIGN</span>

  </div>

  <script>
    // توليد الجزيئات
    const container = document.getElementById('particlesContainer');
    for (let i = 0; i < 50; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 28 + 6;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.animationDuration = (Math.random() * 12 + 10) + 's';
      p.style.animationDelay = Math.random() * 8 + 's';
      container.appendChild(p);
    }
  </script>

</body>
</html>
